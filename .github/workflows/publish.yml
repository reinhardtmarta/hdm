name: Publish HDM to PyPI

on:
  push:
    tags:
      - 'v*' # Dispara a publicação sempre que criar uma tag de versão (ex: v0.2.3)
  workflow_dispatch: # Permite disparar o upload manualmente pela aba Actions do GitHub

jobs:
  build-and-publish:
    name: Build and publish Python distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build binary wheels and source tarball
        run: python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          
